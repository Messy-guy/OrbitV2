name: "Build & Release Orbit (Desktop & Mobile)"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.os_name }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            os_name: 'linux'
          - platform: 'windows-latest'
            os_name: 'windows'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo & Rust Build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Linux build dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build frontend
        run: npm run build

      - name: Build Tauri Desktop App
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RUSTFLAGS: "-C link-arg=-s"
        run: npx tauri build

      - name: Upload Linux Artifacts
        if: matrix.os_name == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: orbit-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

      - name: Upload Windows Artifacts
        if: matrix.os_name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: orbit-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  build-mobile:
    name: Build Android APK
    permissions:
      contents: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Prebuild Native Android Project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build Release APK via Gradle
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon --parallel --build-cache --max-workers=4 -Dorg.gradle.jvmargs="-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8"

      - name: Rename & Stage APK
        run: |
          mkdir -p ../../release-assets
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk ../../release-assets/orbit-mobile.apk || cp android/app/build/outputs/apk/release/*.apk ../../release-assets/orbit-mobile.apk

      - name: Upload Mobile Artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbit-android-apk
          path: release-assets/orbit-mobile.apk

  publish-release:
    name: Publish GitHub Release
    needs: [build-desktop, build-mobile]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Prepare Release Assets
        run: |
          mkdir -p dist-release
          find all-artifacts -type f \( -name "*.AppImage" -o -name "*.deb" -o -name "*.exe" -o -name "*.msi" -o -name "*.apk" \) -exec cp {} dist-release/ \;
          ls -lh dist-release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist-release/*
          draft: false
          prerelease: false
          generate_release_notes: true
