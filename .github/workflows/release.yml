name: "Build & Release Orbit"

on:
  push:
    tags:
      - 'v*'
      - 'desktop-v*'
      - 'mobile-v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target platform to build & release'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - desktop
          - mobile
      release_tag:
        description: 'Tag/version name for the release (e.g. v0.1.25) when run manually'
        required: false
        default: ''
        type: string

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.os_name }})
    if: ${{ (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/mobile-v')) || (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'desktop')) }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            os_name: 'linux'
          - platform: 'windows-latest'
            os_name: 'windows'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo & Rust Build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Linux build dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build frontend
        run: npm run build

      - name: Build Tauri Desktop App
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RUSTFLAGS: "-C link-arg=-s"
        run: npx tauri build

      - name: Upload Linux Artifacts
        if: matrix.os_name == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: orbit-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

      - name: Upload Windows Artifacts
        if: matrix.os_name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: orbit-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  build-mobile:
    name: Build Android APK
    if: ${{ (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/desktop-v')) || (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'mobile')) }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: Install Android NDK & Build-Tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "ndk;27.1.12297006" "build-tools;36.0.0" "platforms;android-36"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Prebuild Native Android Project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build Release APK via Gradle
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon --parallel --build-cache -Dorg.gradle.jvmargs="-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8"

      - name: Rename & Stage APK
        run: |
          mkdir -p ../../release-assets
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk ../../release-assets/orbit-mobile.apk || cp android/app/build/outputs/apk/release/*.apk ../../release-assets/orbit-mobile.apk

      - name: Upload Mobile Artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbit-android-apk
          path: release-assets/orbit-mobile.apk

  publish-release:
    name: Publish GitHub Release
    needs: [build-desktop, build-mobile]
    if: ${{ always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: all-artifacts

      - name: Prepare Release Assets
        run: |
          mkdir -p dist-release
          if [ -d "all-artifacts" ]; then
            find all-artifacts -type f \( -name "*.AppImage" -o -name "*.deb" -o -name "*.exe" -o -name "*.msi" -o -name "*.apk" \) -exec cp {} dist-release/ \;
          fi
          ls -la dist-release/

      - name: Determine Release Tag
        id: release-info
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          elif [ -n "${{ inputs.release_tag }}" ]; then
            echo "tag=${{ inputs.release_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=v0.1.25" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-info.outputs.tag }}
          files: dist-release/*
          draft: false
          prerelease: false
          generate_release_notes: true
