[package]
name = "orbit-desktop"
version = "0.1.0"
description = "Orbit Desktop - Multi-Agent Workspace"
authors = ["Orbit Team"]
edition = "2021"

[lib]
name = "orbit_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
regex = "1.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
