[package]
name = "orbit-desktop"
version = "0.1.0"
description = "Orbit Desktop - Multi-Agent Workspace"
authors = ["Orbit Team"]
edition = "2021"

[lib]
name = "orbit_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["wry"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
alacritty_terminal = "0.26"
parking_lot = "0.12"
thiserror = "2"
tracing = "0.1"
libc = "0.2"
regex = "1.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", default-features = false, features = ["v2_28"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true
